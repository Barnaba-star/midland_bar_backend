spring.application.name=midland-bar

# Where the browser is serving this system's frontend from. A property
# rather than a constant in the security config: the saloon runs on 4200
# and this on 4300, and that is a setting, not a code change.
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:4300}
#database configurations
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:midland_bar}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

#server
server.port=8084

# JWT signing secret - MUST be set via the JWT_SECRET env var (no default,
# on purpose: this repo is public, so a committed secret would let anyone
# forge admin tokens). See README/local setup notes for the local value.
jwt.secret=${JWT_SECRET}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.datasource.driver-class-name=org.postgresql.driver
spring.jpa.hibernate.ddl-auto=update


# Enable SQL query logging
spring.jpa.show-sql=false

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=false

# Log parameter values (important for debugging!)

# Recording a sale writes whole lists at once (saveAll on sales, reports,
# stock). Without batching each row is its own round trip to Postgres.
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Connection pool. Sized for a single backend instance against one Postgres;
# raise max-pool-size only together with Postgres max_connections.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


file.upload-dir=uploads/
spring.web.resources.static-locations=file:uploads/

# Snippe (api.snippe.sh) - Tanzania mobile money payments for branch
# subscriptions. No defaults on purpose (public repo, real money).
snippe.base-url=https://api.snippe.sh
snippe.api-key=${SNIPPE_API_KEY}
snippe.webhook-secret=${SNIPPE_WEBHOOK_SECRET}
# Snippe requires customer.email on every payment and rejects the request
# without it. Subscriptions are paid by a branch, not by a person, so the
# billing address is the platform's rather than whichever staff member
# happened to be at the keyboard - two of whom have no email on file at all.
snippe.billing-email=${SNIPPE_BILLING_EMAIL:midlandcompanylimited@gmail.com}

# Public HTTPS URL Snippe will POST payment.completed/failed events to.
snippe.webhook-url=${SNIPPE_WEBHOOK_URL:https://your-backend-domain.example.com/setting/webhooks/snippe}

# SMS. Off until a provider is wired in - see SmsClient. Nothing sends while
# this is false; attempts are still recorded as SKIPPED so the path can be
# checked before the API arrives.
sms.enabled=${SMS_ENABLED:false}
sms.app-name=${SMS_APP_NAME:Midland}
# Written into the message log only when explicitly turned on - a credentials
# text would otherwise sit in the application log in clear.
sms.log-body=${SMS_LOG_BODY:false}
# Filled in when the provider is chosen.
sms.base-url=${SMS_BASE_URL:}
sms.api-key=${SMS_API_KEY:}
sms.sender-id=${SMS_SENDER_ID:}

# Profile pictures from a phone camera are commonly several MB;
# the 1MB Spring Boot default would reject them.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Percentage of each completed branch subscription payment that goes to the
# staff member who registered that branch. Changing this only affects
# payments recorded from here on - the rate used is snapshot onto every
# subscription_payments row so past months never move.
commission.percent=10
